    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- resume doc -->
  <g filter="url(#glow)">
    <path d="M250 92 H420 L460 132 V358 H250 Z" fill="none" stroke="url(#acc)" stroke-width="3"/>
    <path d="M420 92 V132 H460" fill="none" stroke="url(#acc)" stroke-width="3"/>
  </g>
  <circle cx="292" cy="152" r="18" fill="#00d4ff" fill-opacity="0.35"/>
  <rect x="322" y="140" width="100" height="8" rx="4" fill="#94a3b8"/>
  <rect x="322" y="156" width="66" height="7" rx="3" fill="#64748b"/>
  <g fill="#94a3b8" fill-opacity="0.55">

    <rect x="274" y="214" width="140" height="7" rx="3"/>
    <rect x="274" y="232" width="152" height="7" rx="3"/>
    <rect x="274" y="262" width="96" height="7" rx="3" fill="#00d4ff" fill-opacity="0.7"/>
    <rect x="274" y="280" width="150" height="7" rx="3"/>
    <rect x="274" y="298" width="128" height="7" rx="3"/>
  </g>
  <!-- ATS score gauge -->
  <g transform="translate(568 190)">

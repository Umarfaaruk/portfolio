    <circle r="56" fill="none" stroke="url(#acc)" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="323 352" transform="rotate(-90)" filter="url(#glow)"/>
    <text y="-2" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="27" fill="#f1f5f9">92</text>
    <text y="22" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" fill="#94a3b8">ATS SCORE</text>
  </g>

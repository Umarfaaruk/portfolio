    <circle r="34" fill="none" stroke="url(#acc)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="160 214" transform="rotate(-90)"/>
    <text y="6" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="16" fill="#f1f5f9">75%</text>
  </g>
  <!-- study path dots -->
  <g stroke="#00d4ff" stroke-opacity="0.4" stroke-dasharray="4 7">
    <path d="M230 350 C300 330 360 360 430 342 C480 330 510 336 540 344" fill="none"/>
  </g>
  <circle cx="230" cy="350" r="5" fill="#34d399"/>
  <circle cx="430" cy="342" r="5" fill="#34d399"/>
  <circle cx="540" cy="344" r="5" fill="#fbbf24"/>
  <g stroke="#00d4ff" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M22 52 V22 H52"/><path d="M748 22 H778 V52"/>
    <path d="M778 398 V428 H748"/><path d="M52 428 H22 V398"/>
  </g>
  <text x="34" y="416" font-family="Consolas,Menlo,monospace" font-size="17" fill="#00d4ff" fill-opacity="0.8">EDU://EDUONX.IN · AI TUTORING · LIVE</text>

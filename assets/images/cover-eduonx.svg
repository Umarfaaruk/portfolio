<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="EduOnx AI learning platform cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#0e1233"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#00d4ff" stroke-opacity="0.05">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- graduation cap -->
  <g filter="url(#glow)">
    <path d="M400 118 L540 172 L400 226 L260 172 Z" fill="none" stroke="url(#acc)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M330 204 V258 C330 282 470 282 470 258 V204" fill="none" stroke="url(#acc)" stroke-width="3.5"/>
    <line x1="540" y1="172" x2="540" y2="238" stroke="#00d4ff" stroke-width="3"/>
    <circle cx="540" cy="246" r="6" fill="#00d4ff"/>
  </g>
  <!-- AI sparkle -->
  <path d="M255 260 L263 282 L285 290 L263 298 L255 320 L247 298 L225 290 L247 282 Z" fill="url(#acc)" filter="url(#glow)"/>
  <!-- progress ring -->
  <g transform="translate(560 310)">

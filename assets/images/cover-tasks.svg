<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Task manager web app cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F44A22"/><stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#F44A22" stroke-opacity="0.05">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- task card -->
  <rect x="240" y="82" width="320" height="286" rx="16" fill="none" stroke="url(#acc)" stroke-width="3" filter="url(#glow)"/>
  <rect x="264" y="106" width="130" height="10" rx="5" fill="#EDEDED" fill-opacity="0.7"/>
  <!-- tasks -->
  <g>
    <rect x="264" y="146" width="24" height="24" rx="6" fill="#F44A22" fill-opacity="0.9"/>
    <path d="M270 158 l6 6 l11 -12" stroke="#04101a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="152" width="180" height="9" rx="4" fill="#6E6E6E"/>
    <line x1="302" y1="156.5" x2="482" y2="156.5" stroke="#8C8C8C" stroke-opacity="0.7"/>
  </g>
  <g>
    <rect x="264" y="192" width="24" height="24" rx="6" fill="#FF8A4C" fill-opacity="0.9"/>
    <path d="M270 204 l6 6 l11 -12" stroke="#04101a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="198" width="150" height="9" rx="4" fill="#6E6E6E"/>
    <line x1="302" y1="202.5" x2="452" y2="202.5" stroke="#8C8C8C" stroke-opacity="0.7"/>
  </g>
  <g>
    <rect x="264" y="238" width="24" height="24" rx="6" fill="none" stroke="#F44A22" stroke-width="2.5"/>
    <rect x="302" y="244" width="196" height="9" rx="4" fill="#BDBDBD"/>
  </g>
  <g>
    <rect x="264" y="284" width="24" height="24" rx="6" fill="none" stroke="#F44A22" stroke-width="2.5"/>
    <rect x="302" y="290" width="120" height="9" rx="4" fill="#BDBDBD"/>
  </g>
  <!-- progress -->
  <rect x="264" y="330" width="272" height="10" rx="5" fill="#111111" stroke="#F44A22" stroke-opacity="0.3"/>
  <rect x="264" y="330" width="136" height="10" rx="5" fill="url(#acc)"/>
  <text x="580" y="120" font-family="Consolas,Menlo,monospace" font-size="15" fill="#8C8C8C">2/4 done</text>
  <!-- add button -->
  <circle cx="560" cy="368" r="26" fill="url(#acc)" filter="url(#glow)"/>
  <path d="M560 356 v24 M548 368 h24" stroke="#04101a" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#F44A22" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M22 52 V22 H52"/><path d="M748 22 H778 V52"/>
    <path d="M778 398 V428 H748"/><path d="M52 428 H22 V398"/>
  </g>
  <text x="34" y="416" font-family="Consolas,Menlo,monospace" font-size="17" fill="#F44A22" fill-opacity="0.8">WEB://TASK-MANAGER · DOM STATE</text>
</svg>

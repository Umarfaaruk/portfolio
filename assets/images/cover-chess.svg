<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Chess Buddy AI chess cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#120f2c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#00d4ff" stroke-opacity="0.05">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- board -->
  <g transform="translate(260 105)">
    <rect x="0" y="0" width="280" height="280" fill="none" stroke="url(#acc)" stroke-width="3" filter="url(#glow)"/>
    <g fill="#00d4ff" fill-opacity="0.13">
      <rect x="0" y="0" width="70" height="70"/><rect x="140" y="0" width="70" height="70"/>
      <rect x="70" y="70" width="70" height="70"/><rect x="210" y="70" width="70" height="70"/>
      <rect x="0" y="140" width="70" height="70"/><rect x="140" y="140" width="70" height="70"/>
      <rect x="70" y="210" width="70" height="70"/><rect x="210" y="210" width="70" height="70"/>
    </g>
    <!-- best-move highlight -->
    <rect x="140" y="70" width="70" height="70" fill="none" stroke="#34d399" stroke-width="3"/>
    <path d="M105 245 C105 175 140 140 168 112" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="7 8"/>
    <path d="M175 128 L168 105 L150 122 Z" fill="#34d399"/>
    <!-- knight glyph -->
    <text x="105" y="272" font-size="92" text-anchor="middle" fill="url(#acc)" filter="url(#glow)"
      font-family="'Segoe UI Symbol','Noto Sans Symbols 2',serif">&#9822;</text>
  </g>
  <!-- eval bar -->
  <g transform="translate(580 130)">
    <rect x="0" y="0" width="18" height="230" rx="9" fill="#0f172a" stroke="#00d4ff" stroke-opacity="0.35"/>
    <rect x="0" y="0" width="18" height="92" rx="9" fill="url(#acc)"/>
    <text x="30" y="86" font-family="Consolas,Menlo,monospace" font-size="15" fill="#94a3b8">+1.8</text>
  </g>
  <g stroke="#00d4ff" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M22 52 V22 H52"/><path d="M748 22 H778 V52"/>
    <path d="M778 398 V428 H748"/><path d="M52 428 H22 V398"/>
  </g>
  <text x="34" y="416" font-family="Consolas,Menlo,monospace" font-size="17" fill="#00d4ff" fill-opacity="0.8">ENGINE://STOCKFISH · REAL-TIME EVAL</text>
</svg>

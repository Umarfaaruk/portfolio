<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Aerowash waterless car wash cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#0c1a2c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#00d4ff" stroke-opacity="0.05">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- car -->
  <g filter="url(#glow)">
    <path d="M240 268 L262 216 C268 202 280 194 296 194 L440 194 C456 194 470 200 482 212 L516 244 L560 254 C574 258 582 268 582 282 V296 H240 Z"
      fill="none" stroke="url(#acc)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M300 216 L286 252 H400 V216 Z M420 216 V252 H492 L462 222 C456 216 450 216 442 216 Z"
      fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="312" cy="296" r="26" fill="none" stroke="url(#acc)" stroke-width="3.5"/>
    <circle cx="508" cy="296" r="26" fill="none" stroke="url(#acc)" stroke-width="3.5"/>
  </g>
  <!-- sparkle shine (waterless) -->
  <path d="M262 148 L268 164 L284 170 L268 176 L262 192 L256 176 L240 170 L256 164 Z" fill="#00d4ff" filter="url(#glow)"/>
  <path d="M560 130 L568 152 L590 160 L568 168 L560 190 L552 168 L530 160 L552 152 Z" fill="url(#acc)" filter="url(#glow)"/>
  <!-- no-water droplet -->
  <g transform="translate(620 220)">
    <path d="M0 -18 C10 -4 18 6 18 16 A18 18 0 1 1 -18 16 C-18 6 -10 -4 0 -18 Z" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="-24" y1="26" x2="24" y2="-24" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- eco leaf -->
  <path d="M196 330 C196 306 216 292 244 292 C244 318 226 334 196 330 Z" fill="#34d399" fill-opacity="0.75" filter="url(#glow)"/>
  <text x="300" y="352" font-family="Consolas,Menlo,monospace" font-size="15" fill="#94a3b8">0 litres · doorstep · daily shine</text>
  <g stroke="#00d4ff" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M22 52 V22 H52"/><path d="M748 22 H778 V52"/>
    <path d="M778 398 V428 H748"/><path d="M52 428 H22 V398"/>
  </g>
  <text x="34" y="416" font-family="Consolas,Menlo,monospace" font-size="17" fill="#00d4ff" fill-opacity="0.8">SVC://AEROWASH · WATERLESS · HYDERABAD</text>
</svg>

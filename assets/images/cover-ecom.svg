    <rect x="335" y="110" width="130" height="160" rx="12" stroke="url(#acc)" stroke-opacity="1" stroke-width="3" filter="url(#glow)"/>
    <rect x="500" y="110" width="130" height="160" rx="12"/>
  </g>
  <g fill="#00d4ff" fill-opacity="0.14">
    <rect x="184" y="124" width="102" height="74" rx="8"/>
    <rect x="349" y="124" width="102" height="74" rx="8"/>
    <rect x="514" y="124" width="102" height="74" rx="8"/>
  </g>
  <g fill="#94a3b8" fill-opacity="0.6">

    <rect x="349" y="212" width="70" height="7" rx="3"/><rect x="349" y="228" width="44" height="7" rx="3"/>
    <rect x="514" y="212" width="70" height="7" rx="3"/><rect x="514" y="228" width="44" height="7" rx="3"/>
  </g>
  <rect x="349" y="244" width="102" height="16" rx="8" fill="url(#acc)"/>
  <!-- cart -->
  <g transform="translate(355 300)" stroke="url(#acc)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0 0 h14 l12 58 h52 l12 -42 H22"/>
    <circle cx="32" cy="74" r="6"/>
    <circle cx="70" cy="74" r="6"/>

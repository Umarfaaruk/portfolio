<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bazaar Premier classifieds marketplace cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#00d4ff" stroke-opacity="0.05">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- skyline -->
  <g fill="none" stroke="url(#acc)" stroke-width="3" filter="url(#glow)">
    <path d="M250 348 V240 H310 V348"/>
    <path d="M330 348 V196 L360 170 L390 196 V348"/>
    <path d="M410 348 V150 L430 96 L450 150 V348"/>
    <path d="M470 348 V212 H530 V348"/>
  </g>
  <g fill="#00d4ff" fill-opacity="0.35">
    <rect x="264" y="256" width="10" height="10"/><rect x="286" y="256" width="10" height="10"/>
    <rect x="264" y="280" width="10" height="10"/><rect x="286" y="280" width="10" height="10"/>
    <rect x="344" y="212" width="10" height="10"/><rect x="366" y="212" width="10" height="10"/>
    <rect x="344" y="236" width="10" height="10"/><rect x="366" y="236" width="10" height="10"/>
    <rect x="424" y="170" width="12" height="10"/><rect x="424" y="194" width="12" height="10"/>
    <rect x="484" y="228" width="10" height="10"/><rect x="506" y="228" width="10" height="10"/>
    <rect x="484" y="252" width="10" height="10"/><rect x="506" y="252" width="10" height="10"/>
  </g>
  <line x1="220" y1="348" x2="580" y2="348" stroke="url(#acc)" stroke-width="3"/>
  <!-- price tag -->
  <g transform="translate(566 120) rotate(12)" filter="url(#glow)">
    <path d="M0 22 L22 0 H86 V64 L64 86 L0 22 Z" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="66" cy="20" r="7" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <text x="18" y="60" font-family="Consolas,Menlo,monospace" font-size="22" fill="#fbbf24" transform="rotate(-12 18 60)">AED</text>
  </g>
  <!-- verified badge -->
  <g transform="translate(212 140)">
    <path d="M0 -26 L7 -8 L26 -8 L11 4 L17 24 L0 12 L-17 24 L-11 4 L-26 -8 L-7 -8 Z" fill="url(#acc)" filter="url(#glow)" transform="rotate(18)"/>
    <path d="M-7 0 l5 5 l10 -11" stroke="#04101a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="248" y="386" font-family="Consolas,Menlo,monospace" font-size="15" fill="#94a3b8">verified dealers · cars · property · tech</text>
  <g stroke="#00d4ff" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M22 52 V22 H52"/><path d="M748 22 H778 V52"/>
    <path d="M778 398 V428 H748"/><path d="M52 428 H22 V398"/>
  </g>
  <text x="34" y="416" font-family="Consolas,Menlo,monospace" font-size="17" fill="#00d4ff" fill-opacity="0.8">MKT://BAZAAR-PREMIER · DUBAI · LIVE</text>
</svg>

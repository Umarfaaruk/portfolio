    <rect x="16" y="-20" width="7" height="40" rx="3"/>
    <rect x="32" y="-13" width="7" height="26" rx="3"/>
    <rect x="48" y="-26" width="7" height="52" rx="3"/>
    <rect x="64" y="-9" width="7" height="18" rx="3"/>
    <rect x="80" y="-17" width="7" height="34" rx="3"/>
    <rect x="96" y="-24" width="7" height="48" rx="3"/>
    <rect x="112" y="-11" width="7" height="22" rx="3"/>
    <rect x="128" y="-18" width="7" height="36" rx="3"/>
    <rect x="144" y="-7" width="7" height="14" rx="3"/>
    <rect x="160" y="-15" width="7" height="30" rx="3"/>
    <rect x="176" y="-22" width="7" height="44" rx="3"/>

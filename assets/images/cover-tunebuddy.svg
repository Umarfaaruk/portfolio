    <path d="M210 174 L198 196 L232 174 Z" fill="none" stroke="#00d4ff" stroke-width="2.5"/>
  </g>
  <rect x="204" y="134" width="150" height="8" rx="4" fill="#00d4ff" fill-opacity="0.5"/>
  <rect x="204" y="150" width="90" height="8" rx="4" fill="#00d4ff" fill-opacity="0.3"/>

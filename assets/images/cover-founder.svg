<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Founder and Growth virtual assistant site cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#00d4ff" stroke-opacity="0.05">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>
  <!-- calendar -->
  <g transform="translate(230 112)" filter="url(#glow)">
    <rect x="0" y="14" width="196" height="180" rx="14" fill="none" stroke="url(#acc)" stroke-width="3"/>
    <line x1="0" y1="58" x2="196" y2="58" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="46" y1="0" x2="46" y2="28" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="0" x2="150" y2="28" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
    <g fill="#00d4ff" fill-opacity="0.25">
      <rect x="20" y="76" width="34" height="26" rx="5"/>
      <rect x="64" y="76" width="34" height="26" rx="5"/>
      <rect x="108" y="112" width="34" height="26" rx="5" fill="url(#acc)" fill-opacity="1"/>
      <rect x="152" y="76" width="24" height="26" rx="5"/>
      <rect x="20" y="112" width="34" height="26" rx="5"/>
      <rect x="64" y="148" width="34" height="26" rx="5"/>
    </g>
  </g>
  <!-- inbox zero + growth arrow -->
  <g transform="translate(500 130)">
    <rect x="0" y="0" width="150" height="96" rx="12" fill="none" stroke="url(#acc)" stroke-width="3" filter="url(#glow)"/>
    <path d="M0 40 L52 40 L66 58 L84 58 L98 40 L150 40" fill="none" stroke="#00d4ff" stroke-width="2.5"/>
    <circle cx="128" cy="18" r="11" fill="#34d399"/>
    <path d="M122 18 l4 4 l8 -8" stroke="#04101a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(500 268)" filter="url(#glow)">
    <path d="M0 66 L38 36 L72 52 L128 -4" fill="none" stroke="url(#acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 -4 l-20 2 M128 -4 l-4 20" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="234" y="342" font-family="Consolas,Menlo,monospace" font-size="15" fill="#94a3b8">delegate &#8594; execute &#8594; grow</text>
  <g stroke="#00d4ff" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M22 52 V22 H52"/><path d="M748 22 H778 V52"/>
    <path d="M778 398 V428 H748"/><path d="M52 428 H22 V398"/>
  </g>
  <text x="34" y="416" font-family="Consolas,Menlo,monospace" font-size="17" fill="#00d4ff" fill-opacity="0.8">BIZ://FOUNDER-GROWTH · VA SERVICES</text>
</svg>
